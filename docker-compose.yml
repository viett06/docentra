name: docentra

x-app: &app
  image: docentra-app:local
  pull_policy: never
  environment: &app-environment
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-docentra}
    POSTGRES_USER: ${POSTGRES_USER:-docentra}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    S3_BUCKET: ${S3_BUCKET:-docentra-private}
    DEMO_MODE: ${DEMO_MODE:-false}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    OCR_LANGUAGES: vie+eng

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docentra}
      POSTGRES_USER: ${POSTGRES_USER:-docentra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - object_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *app
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  seed:
    <<: *app
    command: python -m app.seed
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  api:
    <<: *app
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *app
    command: python -m app.worker
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  postgres_data:
  object_data:
